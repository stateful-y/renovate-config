name: Renovate

on:
  schedule:
    # Daily 05:00 UTC. The preset's own `schedule` still gates when PRs may open, so a
    # repo is only acted on inside its allowed window even if the runner fires.
    #
    # This was Mondays only, which combined with the preset's `prHourlyLimit: 2` to cap
    # the whole fleet at two dependency PRs per repo per week. Everything past the second
    # went to the dashboard's Rate-Limited section and stayed there, so the dashboards
    # grew without bound: 61 queued updates across eight repos by the time it was looked
    # at. A weekly runner also means a stale branch waits a week for its rebase, which
    # matters because the org ruleset requires branches be up to date before merging.
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      logLevel:
        description: "Renovate log level"
        default: "info"
        type: choice
        options: ["debug", "info", "warn"]

concurrency:
  group: renovate
  cancel-in-progress: false

permissions: {}

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Mint a short-lived installation token from the GitHub App. Scoped to every
      # repo the App is installed on in the org, so Renovate can autodiscover and
      # open PRs across the fleet. NOT the default GITHUB_TOKEN, which sees only this
      # repo. The App's permissions must include Workflows:write, or any PR that
      # edits .github/workflows/* fails to push.
      - name: Mint an App installation token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Run Renovate over the fleet
        uses: renovatebot/github-action@v43.0.0
        with:
          configurationFile: config.js
          token: ${{ steps.app-token.outputs.token }}
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
